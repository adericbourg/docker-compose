global:
  scrape_interval: 30s

scrape_configs:

  # ── Latency & packet loss via ICMP ───────────────────────────────────────────
  - job_name: blackbox_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 8.8.8.8     # Google DNS
          - 1.1.1.1     # Cloudflare DNS
          - 86.54.11.100 # DNS4EU
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Videoconference latency, jitter & loss via 1 s pings ─────────────────────
  # Targets are configured on the smokeping-prober container (docker-compose.yml)
  - job_name: smokeping
    static_configs:
      - targets:
          - smokeping-prober:9374

  # ── HTTP availability (response time, status) ────────────────────────────────
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://www.google.com
          - https://www.cloudflare.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
