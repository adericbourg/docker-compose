# Monitoring stack — Blackbox Exporter + Speedtest Exporter + VictoriaMetrics + Grafana
# Compatible arm64 (Freebox Ultra)
# Usage: docker compose up -d

services:

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - vm_data:/storage
      - ./victoriametrics/scrape_config.yml:/etc/victoriametrics/scrape_config.yml:ro
    command:
      - --storageDataPath=/storage
      - --retentionPeriod=120d
      - --promscrape.config=/etc/victoriametrics/scrape_config.yml
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    cap_add:
      - NET_RAW   # Required for ICMP probes (ping)
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped

  smokeping-prober:
    image: quay.io/superq/smokeping-prober:latest
    container_name: smokeping-prober
    cap_add:
      - NET_RAW   # Required for ICMP probes (ping)
    # Pings every second. 1 ms buckets up to 30 ms so jitter (histogram stddev) isn't
    # dominated by bucket width — the default buckets double at each step.
    command:
      - --buckets=0.001,0.002,0.003,0.004,0.005,0.006,0.007,0.008,0.009,0.01,0.011,0.012,0.013,0.014,0.015,0.016,0.017,0.018,0.019,0.02,0.021,0.022,0.023,0.024,0.025,0.026,0.027,0.028,0.029,0.03,0.035,0.04,0.045,0.05,0.055,0.06,0.065,0.07,0.075,0.08,0.085,0.09,0.095,0.1,0.15,0.2,0.3,0.5,1
      - meet.google.com   # Google Meet
      - meet.proton.me    # Proton Meet
      - zoom.us           # Zoom (web front end, not media servers)
    restart: unless-stopped

  speedtest-exporter:
    # Note: check arm64 availability with `docker manifest inspect miguelndecarvalho/speedtest-exporter`
    # Alternative if unavailable: ghcr.io/nicolerenee/speedtest-exporter
    image: miguelndecarvalho/speedtest-exporter:latest
    container_name: speedtest-exporter
    ports:
      - "9798:9798"
    restart: unless-stopped
    # The image ships a built-in HEALTHCHECK that probes `localhost` (resolves to ::1),
    # but waitress binds IPv4 only — probe always fails. Disable it; nothing depends on
    # this service's health status in this stack.
    healthcheck:
      disable: true

  speedtest-scheduler:
    image: alpine:latest
    container_name: speedtest-scheduler
    depends_on:
      - speedtest-exporter
      - victoriametrics
    volumes:
      - ./speedtest-scheduler/schedule.sh:/etc/periodic/hourly/speedtest:ro
    environment:
      - TZ=Europe/Paris
      - PEAK_HOURS_START=9
      - PEAK_HOURS_END=18
      - LUNCH_BREAK_START=12
      - LUNCH_BREAK_END=13
    command: >
      sh -c "apk add --no-cache curl tzdata && crond -f -d 8"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    depends_on:
      - victoriametrics
    restart: unless-stopped

volumes:
  vm_data:
  grafana_data:
